[project]
name = "prisk-system"
version = "1.0.0"
description = "本地 Git 分支代码审计与结构化变更分析工具"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["prisk*"]
